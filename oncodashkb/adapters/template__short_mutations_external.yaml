row:
    translate:
        column: patient_id
        to_subject: patient
        translations_file: {{{DECIDER_DIR}}}/clinical_export.xlsx
        translate_from: Patient card::Patient cohort code_Patient Card
        translate_to: Patient card::Publication code
        index_col: 0
        on_unknown_value: skip
        usecols: [0,1,2]
transformers:
    # Nodes
    ## Sample
    - translate_sample_ids :
        column: sample_id
        to_object: sample
        via_relation: patient_carries_sample
        translations_file: {{{DECIDER_DIR}}}/clinical_export.xlsx
        translate_from: Patient card::Patient cohort code_Patient Card
        translate_to: Patient card::Publication code
        index_col: 0
        usecols: [0,1,2]
    ## Alteration
    - map:
        column: alteration
        from_subject: sample       
        to_object: short_mutation
        via_relation: sample_carries_variant
    ## Gene Stauts
    - translate_cat_format:
        columns:
          - hugoSymbol
          - gene_role
        from_subject: short_mutation
        to_object: gene_status
        via_relation: variant_causes_gene_status
        format_string: "{hugoSymbol}:{gene_role}"
        column_to_translate: 
            - gene_role
        translations:
            Loss-of-function: loss
            Likely Loss-of-function: loss
            Gain-of-function: gain
            Likely Gain-of-function: gain
            Inconclusive: Inconclusive
            Unknown: Unknown
            Likely Neutral: Likely Neutral
    ## Genes
    - map:
        column: ensembl_id
        from_subject: gene_status
        to_object: gene
        via_relation: gene_status_affects_gene
        reverse_relation: gene_affected_by_gene_status
    # Properties
    ## Gene Stauts
    - translate_cat_format:
        columns:
          - ensembl_id
          - gene_role
        from_subject: short_mutation
        for_object: gene_status
        to_property: ensembl_id_gene_status
        format_string: "{ensembl_id}:{gene_role}"
        column_to_translate:
            - gene_role
        translations:
            Loss-of-function: loss
            Likely Loss-of-function: loss
            Gain-of-function: gain
            Likely Gain-of-function: gain
            Inconclusive: Inconclusive
            Unknown: Unknown
            Likely Neutral: Likely Neutral
    - translate:
        columns: gene_role
        to_property: gene_role
        for_object: gene_status
        on_unknown_value: skip
        translations:
            Loss-of-function: loss
            Likely Loss-of-function: loss
            Gain-of-function: gain
            Likely Gain-of-function: gain
            Inconclusive: Inconclusive
            Unknown: Unknown
            Likely Neutral: Likely Neutral
    - boolean:
        columns: gene_role
        to_property: likely
        for_object: variant_causes_gene_status
        consider_true:
            - Likely Loss-of-function
            - Likely Gain-of-function
            - Likely Neutral
        consider_false:
            - Loss-of-function
            - Gain-of-function
            - Inconclusive
            - Unknown
    ## Genes
    - map:
        column: hugoSymbol
        to_property: gene_symbol
        for_object: gene
    ## Alterations
    - map:
        column: tumorType
        to_property: tumor_type
        for_object: short_mutation
    - map:
        column: consequence
        to_property: consequence
        for_object: short_mutation
    - map:
        column: oncokb_oncogenic
        to_property: oncokb_oncogenic_annotation
        for_object: short_mutation
    - boolean:
        column: oncokb_oncogenic
        to_property: oncogenic
        for_object: short_mutation
        consider_true:
            - Oncogenic
            - Likely Oncogenic
        consider_false:
            - Unknown
            - Likely Neutral
            - Inconclusive
    - replace:
        column: mutationEffectDescription
        to_property: mutation_effect_description
        for_object: short_mutation
        forbidden: "[']"
        substitute: "_"
    - map:
        column: citationPMids
        to_property: citation_PM_ids
        for_object: short_mutation
    - replace:
        column: geneSummary
        to_property: gene_summary
        for_object: gene
        forbidden: "[']"
        substitute: "_"
    - replace:
        column: variantSummary
        to_property: variant_summary
        for_object: short_mutation
        forbidden: "[']"
        substitute: "_"
    - replace:
        column: tumorTypeSummary
        to_property: tumor_type_summary
        for_object: short_mutation
        forbidden: "[']"
        substitute: "_"
    - string:
        value: " "
        to_property: edgelabel
        for_objects:
            - patient_carries_sample
            - sample_carries_variant
            - variant_causes_gene_status
            - gene_status_affects_gene
            - gene_affected_by_gene_status
    - translate:
        column: patient_id
        to_property: visualisation_label
        for_object: patient
        translations_file: {{{DECIDER_DIR}}}/clinical_export.xlsx
        translate_from: Patient card::Patient cohort code_Patient Card
        translate_to: Patient card::Publication code
        index_col: 0
        on_unknown_value: skip
        usecols: [0,1,2]
    - translate_sample_ids :
        column: sample_id
        to_property: visualisation_label
        for_object: sample
        translations_file: {{{DECIDER_DIR}}}/clinical_export.xlsx
        translate_from: Patient card::Patient cohort code_Patient Card
        translate_to: Patient card::Publication code
        index_col: 0
        usecols: [0,1,2]
    - map:
        column: alteration
        to_property: visualisation_label
        for_object: short_mutation
    - translate:
        columns: gene_role
        to_property: visualisation_label
        for_object: gene_status
        on_unknown_value: skip
        translations:
            Loss-of-function: loss
            Likely Loss-of-function: loss
            Gain-of-function: gain
            Likely Gain-of-function: gain
            Inconclusive: Inconclusive
            Unknown: Unknown
            Likely Neutral: Likely Neutral
    - map:
        column: hugoSymbol
        to_property: visualisation_label
        for_object: gene
metadata:
        - data_source: DECIDER_short_mutations_external
