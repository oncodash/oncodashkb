row:
    translate:
        column: patient_id
        to_subject: patient
        translations_file: {{{DECIDER_DIR}}}/clinical_export.xlsx
        translate_from: Patient card::Patient cohort code_Patient Card
        translate_to: Patient card::Publication code
        index_col: 0
        on_unknown_value: skip
        usecols: [0,1,2]
transformers:
    - translate_sample_ids :
        column: sample_id
        to_object: sample
        via_relation: patient_carries_sample
        translations_file: {{{DECIDER_DIR}}}/clinical_export.xlsx
        translate_from: Patient card::Patient cohort code_Patient Card
        translate_to: Patient card::Publication code
        index_col: 0
        usecols: [0,1,2]
    - cat_format:
        columns:
            - hugoSymbol
            - alteration
        from_subject: sample
        to_object: copy_number_amplification
        format_string: "{hugoSymbol}:{alteration}"
        via_relation: sample_carries_variant
    - map:
        column: nMinor
        to_property: nMinor
        for_object: sample_carries_variant
    - map:
        column: nMajor
        to_property: nMajor
        for_object: sample_carries_variant
    - boolean:
        column: expressed
        to_property: expressed
        for_object: sample_carries_variant
        consider_true:
            - True
        consider_false:
            - False
    - map:
        column: RNA_quant
        to_property: RNA_quant
        for_object: sample_carries_variant
    - translate:
        column: patient_id
        to_property: visualisation_label
        for_object: patient
        translations_file: {{{DECIDER_DIR}}}/clinical_export.xlsx
        translate_from: Patient card::Patient cohort code_Patient Card
        translate_to: Patient card::Publication code
        index_col: 0
        on_unknown_value: skip
        usecols: [0,1,2]
    - translate_sample_ids :
        column: sample_id
        to_property: visualisation_label
        for_object: sample
        translations_file: {{{DECIDER_DIR}}}/clinical_export.xlsx
        translate_from: Patient card::Patient cohort code_Patient Card
        translate_to: Patient card::Publication code
        index_col: 0
        usecols: [0,1,2]
    - cat_format:
        columns:
            - hugoSymbol
            - alteration
        to_property: visualisation_label
        for_object: copy_number_amplification
        format_string: "{hugoSymbol}:{alteration}"

metadata:
        - data_source: DECIDER_copy_number_amplifications_local
